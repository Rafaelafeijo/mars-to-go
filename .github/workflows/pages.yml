name: Deploy game to GitHub Pages

# Runs on every push to main and twice a day, so the DONKI snapshot
# (layer 2 of ADR-0004) is refreshed inside the published site.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: DONKI snapshot
        run: node scripts/donki-snapshot.mjs
      - name: Build game
        run: pnpm --filter @mars-to-go/web build
        env:
          BASE_PATH: /mars-to-go/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
